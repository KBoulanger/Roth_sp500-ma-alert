name: Daily SPY SMA Telegram

on:
  schedule:
    # Fixed-Eastern post-close retries. Nasdaq's official index close can still
    # be corrected through 5:15 PM ET, so the full portfolio monitor deliberately
    # waits until after that deadline rather than treating a 4 PM value as final.
    - cron: '20,40 17 * * 1-5'
      timezone: "America/New_York"
    # Final strict attempt. A missing source fails closed and triggers the existing
    # Telegram workflow-failure alert instead of advancing only part of the state.
    - cron: '10 18 * * 1-5'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force_repeat:
        description: "Send the completed session again even if already reported"
        required: false
        default: false
        type: boolean
      force_partial_data:
        description: "Unsafe diagnostic only: permit incomplete/stale daily inputs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # required to commit updated state.json back to the repo

concurrency:
  group: daily-spy-sma-telegram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled retries must see a state commit made by an earlier run.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scheduler safety tests
        run: python -m unittest -v test_scheduler.py

      - id: bot
        run: python send_spy_ma_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          FINAL_ATTEMPT: ${{ github.event_name == 'schedule' && github.event.schedule == '10 18 * * 1-5' }}
          FORCE_REPEAT: ${{ inputs.force_repeat || false }}
          FORCE_PARTIAL_DATA: ${{ inputs.force_partial_data || false }}

      - name: Commit updated state.json
        if: success()
        run: |
          if [ -f state.json ]; then
            git config user.name "telegram-bot"
            git config user.email "bot@github-actions"
            git add state.json
            if git diff --staged --quiet; then
              echo "No state changes to commit."
            else
              git commit -m "state update $(date -u +%Y-%m-%d)"
              git push
            fi
          fi

      # Alert on either signal/data failure or failure to persist state. The latter
      # matters because an uncommitted idempotency key could duplicate the report.
      - name: Notify on workflow or state-persistence failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=🚨 <b>BOT FAILURE</b> — run or state persistence failed on $(date -u +'%Y-%m-%d %H:%M UTC'). Do not infer a position change. Check workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
